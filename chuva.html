<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f45d9b" />
    <title>Chuva de carinho | Nosso primeiro mês</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="social.css" />
    <style>
      .rain-page{position:relative;min-height:calc(100vh - 157px);display:grid;place-items:center;overflow:hidden;padding:70px 20px}.rain-back{position:absolute;top:28px;left:20px;z-index:3;margin:0}.rain-back a{color:var(--pink);font-size:11px;text-decoration:none;text-transform:uppercase;letter-spacing:1.5px}.rain-content{position:relative;z-index:2;width:min(600px,100%);padding:54px 28px;text-align:center;background:#fffaf5e8;border:1px solid var(--border);border-radius:24px;box-shadow:0 20px 60px #b9799e24}.rain-content h1{margin:0;color:var(--ink);font:700 clamp(44px,8vw,76px)/.9 'Baloo 2',sans-serif}.rain-content h1 em{color:var(--pink);font-style:normal}.rain-content p{margin:22px auto 0;max-width:400px;color:var(--muted);font-size:15px;line-height:1.7}.rain-heart{position:absolute;top:-40px;color:var(--pink);font-size:20px;pointer-events:none;animation:rainFall linear forwards}.rain-heart:nth-child(3n){color:#eaa044}.rain-heart:nth-child(4n){font-size:14px;color:#e98ab4}@keyframes rainFall{to{transform:translateY(115vh) rotate(360deg);opacity:0}}.rain-button{display:inline-flex;margin-top:28px;padding:13px 20px;border:1px solid var(--pink);border-radius:999px;background:var(--pink);color:#fff;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}@media(max-width:560px){.rain-page{padding:38px 14px}.rain-back{top:16px;left:14px}.rain-content{padding:42px 20px}.rain-content p{font-size:13px}}
    </style>
  </head>
  <body>
    <div class="sparkle-field" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Voltar ao início"><span class="brand-bow">🎀</span><span>mês<span class="brand-dot">.</span>um</span></a>
      <nav class="nav-links" aria-label="Navegação principal">
        <a href="historia.html">nossa história</a>
        <a href="momentos.html">momentos</a>
        <a href="playlist.html">playlist</a>
        <a class="nav-heart" href="carta.html">♥</a>
      </nav>
    </header>

    <main class="rain-page" id="rain-page">
      <p class="rain-back"><a href="index.html">← voltar para o início</a></p>
      <section class="rain-content">
        <p class="eyebrow"><span>♥</span> uma página só nossa</p>
        <h1>chuva de <em>carinho</em></h1>
        <p>Porque às vezes um coração só não consegue contar tudo o que eu sinto por você.</p>
        <a class="rain-button" href="index.html">voltar para o início</a>
      </section>
    </main>

    <footer>
      <span>feito para meu amor</span><span class="footer-heart">♥</span><span>com carinho, sempre</span>
      <span class="social-links footer-socials" aria-label="Instagrams">
        <a class="social-link social-link-label" href="https://www.instagram.com/lalavcard/" target="_blank" rel="noopener noreferrer" aria-label="Instagram da Lav" title="Instagram da Lav"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg><span>Lav</span></a>
        <a class="social-link social-link-label" href="https://www.instagram.com/kaiqe.dias/" target="_blank" rel="noopener noreferrer" aria-label="Instagram do Kaique" title="Instagram do Kaique"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg><span>Kaique</span></a>
      </span>
    </footer>

    <script src="script.js"></script>
    <script>
      const rainPage = document.querySelector('#rain-page');
      const createRainHeart = () => {
        const heart = document.createElement('span');
        heart.className = 'rain-heart';
        heart.textContent = Math.random() > 0.25 ? '♥' : '✦';
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${4 + Math.random() * 5}s`;
        heart.style.animationDelay = `${Math.random() * 2}s`;
        rainPage.appendChild(heart);
        setTimeout(() => heart.remove(), 10000);
      };
      for (let index = 0; index < 22; index += 1) createRainHeart();
      setInterval(createRainHeart, 420);
    </script>
  </body>
</html>
