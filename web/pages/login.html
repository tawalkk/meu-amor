<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#df5b91" />
    <title>Nosso cantinho | mês.dois</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/modern.css" />
    <link rel="stylesheet" href="../assets/css/auth.css" />
    <script>document.documentElement.classList.add('auth-pending')</script>
    <script src="../assets/js/couple-config.js"></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <a class="login-brand" href="../index.html"><img class="login-brand-icon" src="../assets/images/icon_appandsite.png" alt="" /> mês.dois</a>
      <section class="login-card" aria-labelledby="login-title">
        <span class="login-heart" aria-hidden="true">♥</span>
        <p class="eyebrow"><span>♡</span> um cantinho só nosso</p>
        <h1 id="login-title">que bom ter<br /><em>você aqui.</em></h1>
        <p class="login-intro">entre para ver nossos momentos e deixar um carinho.</p>
        <form id="site-login-form" class="site-login-form">
          <label for="login-username">seu usuário</label>
          <input id="login-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="digite seu usuário" required />
          <label for="login-password">sua senha</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="digite sua senha" required />
          <p id="login-status" class="login-status" role="status" aria-live="polite"></p>
          <button class="login-submit" type="submit">entrar no nosso cantinho <span>♥</span></button>
        </form>
        <p class="login-note">um espaço privado para nós dois.</p>
      </section>
      <span class="login-sparkle sparkle-left" aria-hidden="true">✦</span>
      <span class="login-sparkle sparkle-right" aria-hidden="true">✧</span>
    </main>
    <script src="../assets/js/site-auth.js"></script>
  </body>
</html>
