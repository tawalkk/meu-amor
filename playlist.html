<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f45d9b" />
    <title>Nossa playlist | Nosso primeiro mês</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="social.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23fff0f6'/%3E%3Cpath d='M32 49S10 36 10 21c0-8 11-12 17-3 5-9 27-5 27 3 0 15-22 28-22 28Z' fill='%23f45d9b'/%3E%3C/svg%3E" />
    <style>
      .page-main {
        padding: 72px 0 100px;
        min-height: calc(100vh - 180px);
      }
      .page-intro {
        margin: 0 auto 28px;
        width: min(1120px, calc(100% - 64px));
      }
      .page-intro a {
        color: var(--pink);
        font-size: 11px;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }
      .page-intro a:hover {
        text-decoration: underline;
      }
      .playlist-shell {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 18px 42px rgba(207, 108, 151, 0.08);
      }
      .playlist-header {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 22px;
      }
      .playlist-header .eyebrow {
        margin: 0;
      }
      .playlist-header h2 {
        margin: 0;
        font: 700 clamp(42px, 5vw, 64px)/0.9 'Baloo 2', sans-serif;
        letter-spacing: -1px;
        color: var(--ink);
      }
      .playlist-header h2 em {
        color: var(--pink);
        font-style: normal;
      }
      .playlist-frame-wrap {
        border-radius: 18px;
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--border);
      }
      .playlist-frame-wrap iframe {
        display: block;
        width: 100%;
        min-height: 352px;
        border: 0;
        background: transparent;
      }
      .playlist-note {
        margin-top: 18px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }
      @media (max-width: 800px) {
        .page-main {
          padding-top: 54px;
        }
        .page-intro {
          width: calc(100% - 28px);
        }
        .playlist-shell {
          padding: 18px 16px;
        }
        .playlist-header h2 {
          font-size: clamp(34px, 11vw, 48px);
        }
        .playlist-note {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div class="sparkle-field" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Voltar ao início">
        <span class="brand-bow">🎀</span>
        <span>mês<span class="brand-dot">.</span>um</span>
      </a>
      <nav class="nav-links" aria-label="Navegação principal">
        <a href="historia.html">nossa história</a>
        <a href="momentos.html">momentos</a>
        <a href="playlist.html">playlist</a>
        <a class="nav-heart" href="carta.html">♥</a>
      </nav>
    </header>

    <main class="page-main">
      <div class="page-intro">
        <a href="index.html">← voltar para o início</a>
      </div>

      <section class="section-wrap">
        <div class="playlist-shell">
          <div class="playlist-header">
            <p class="eyebrow"><span>♫</span> a trilha do nosso amor</p>
            <h2>nossa <em>playlist</em></h2>
          </div>

          <div class="playlist-frame-wrap">
            <iframe
              data-testid="embed-iframe"
              style="border-radius:12px"
              src="https://open.spotify.com/embed/playlist/0aBBZCXADZWdKQbgGDT3ro?utm_source=generator&si=d1495ffbe17d4ae4"
              width="100%"
              height="352"
              frameBorder="0"
              allowfullscreen=""
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy"
            ></iframe>
          </div>

          <p class="playlist-note">
            Uma playlist só nossa, com músicas que parecem feitas pra nos acompanhar nos melhores momentos e também nos mais fofos.
          </p>
        </div>
      </section>
    </main>

    <footer>
      <span>feito para meu amor</span>
      <span class="footer-heart">♥</span>
      <span>com carinho, sempre</span>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
